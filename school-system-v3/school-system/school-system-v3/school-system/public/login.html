<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校管理系统 · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%); }
  .card { background: #fff; width: 400px; border-radius: 16px; padding: 40px 36px;
          box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .logo { text-align: center; margin-bottom: 8px; font-size: 34px; }
  h1 { text-align: center; color: #1e3a8a; font-size: 22px; margin-bottom: 4px; }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 26px; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #2563eb; }
  button { width: 100%; margin-top: 24px; padding: 12px; background: #2563eb; color: #fff;
           border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .err { color: #e53e3e; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
  .demo { margin-top: 22px; background: #f0f6ff; border-radius: 8px; padding: 12px 14px; font-size: 12px; color: #555; line-height: 1.9; }
  .demo b { color: #2563eb; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫</div>
    <h1>智慧校园管理系统</h1>
    <div class="sub">School Management System</div>
    <label>账号</label>
    <input id="username" placeholder="请输入账号" autocomplete="username">
    <label>密码</label>
    <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button onclick="doLogin()">登 录</button>
    <div style="text-align:center;margin-top:16px;">
      <a href="register.html" style="color:#2563eb;font-size:14px;text-decoration:none;">教师/学生/家长 点击注册</a>
    </div>
  </div>
<script>
  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || '登录失败'; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);
      localStorage.setItem('name', data.name);
      location.href = data.home;
    } catch (e) { err.textContent = '网络错误，请重试'; }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
